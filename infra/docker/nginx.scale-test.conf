# Trust Layer T11.3 local verification only: load-balances across however
# many `api` replicas `docker compose up --scale api=N` starts.
#
# Static `upstream { server api:8000; }` would NOT actually round-robin
# here -- nginx resolves a plain hostname once at config-load time and
# caches that single IP forever, so it would only ever talk to whichever
# one replica Docker's DNS happened to answer with first. Using a
# `resolver` + a variable in `proxy_pass` instead forces nginx to
# re-resolve per the resolver's TTL, and Docker's embedded DNS (127.0.0.11)
# round-robins the A record across every replica of a scaled service --
# so requests genuinely spread across replicas over the test's duration,
# not just at startup.
#
# Not used in production -- the k8s Service (infra/k8s/10-api-deployment.yaml)
# is the real load balancer there.
events {}

http {
  resolver 127.0.0.11 valid=2s;

  server {
    listen 8000;

    location / {
      set $upstream http://api:8000;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      add_header X-Upstream-Addr $upstream_addr always;
    }
  }
}
