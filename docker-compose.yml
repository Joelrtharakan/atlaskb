services:
  postgres:
    image: pgvector/pgvector:pg16
    # Credentials come from the environment (Compose auto-loads the repo-root
    # .env). No secret literals live in this tracked file; POSTGRES_PASSWORD is
    # required — copy .env.example to .env and set it.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlaskb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}
      POSTGRES_DB: ${POSTGRES_DB:-atlaskb}
    ports:
      # Host 15432 -> container 5432 to avoid clashing with a local Postgres.
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-atlaskb} -d $${POSTGRES_DB:-atlaskb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Trust Layer T11.2, opt-in (`docker compose --profile pgbouncer up`):
  # session-pooled Postgres access for horizontal scaling. Each API replica's
  # own SQLAlchemy pool (db_pool_size + db_max_overflow, see app/config.py)
  # bounds *that replica's* connections, but N replicas each opening that
  # many connections directly against Postgres still multiplies against its
  # own max_connections (100 by default) — PgBouncer centralizes pooling so
  # the replica count can grow without also growing Postgres's real
  # connection load. Point DATABASE_URL at postgres:6432 (not postgres:5432)
  # to use it: postgresql+psycopg://<user>:<pass>@pgbouncer:6432/<db>.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p2
    profiles: ["pgbouncer"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlaskb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atlaskb}
      POOL_MODE: session
      # SQLAlchemy issues prepared statements; PgBouncer's session mode
      # supports them, but transaction/statement mode would silently break
      # them -- session mode is the only one compatible with this app as-is.
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380 -> container 6379 to avoid clashing with a local Redis.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # Repo root: the API + workers are one uv workspace sharing the app package.
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlaskb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atlaskb}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      # Uploaded files must be readable by the worker — shared volume, same path.
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-local}
      # LLM provider. Ollama runs on the *host* (not in this compose file) and
      # stays bound to the host's loopback — from inside the container we reach it
      # via host.docker.internal. Port 11434 is NOT published anywhere public.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.1}
    extra_hosts:
      # Let the container resolve the host's loopback where Ollama listens
      # (needed on Linux; a no-op on Docker Desktop where it's built in).
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 10

  workers:
    build:
      context: .
      dockerfile: infra/docker/workers.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlaskb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atlaskb}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      UPLOAD_DIR: /data/uploads
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-local}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
