[project]
name = "atlaskb-api"
version = "0.0.0"
description = "AtlasKB API — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    # Auth
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    # Ingestion / parsing
    "pypdf>=5.1",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
    # Embeddings (local, no external API required) + query embedding at search time
    "sentence-transformers>=3.3",
    # LLM via an OpenAI-compatible client — serves both Ollama (local) and
    # OpenRouter (hosted). Ollama exposes the same API under /v1.
    "openai>=1.55",
    # Agentic retrieval orchestration
    "langgraph>=0.2.60",
    # Enqueue ingestion jobs onto the Celery broker
    "celery>=5.4",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
