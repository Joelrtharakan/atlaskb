# Alembic configuration for AtlasKB API.
# Configured but intentionally without migrations in this scaffold phase.
[alembic]
script_location = alembic
prepend_sys_path = .
# The URL is resolved at runtime from the DATABASE_URL env var (see alembic/env.py).
# This placeholder is only used if the env var is unset.
sqlalchemy.url = postgresql+psycopg://atlaskb:atlaskb@localhost:5432/atlaskb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
