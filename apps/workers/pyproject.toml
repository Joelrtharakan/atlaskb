[project]
name = "atlaskb-workers"
version = "0.0.0"
description = "AtlasKB Celery workers"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    # The ingestion task reuses the shared domain layer (models, chunking,
    # embeddings) that lives in the API's `app` package.
    "atlaskb-api",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlaskb_workers"]
